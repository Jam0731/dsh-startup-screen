<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>启动动画 · 设置预览</title>
  <script>sessionStorage.setItem('dsh-startup-screen:shown','1')</script>
  <style>
    :root { --dsw-alias-label-primary:#25262b; --dsw-alias-label-tertiary:#747681; --dsw-alias-border-l2:#e2e4e9;
      --dsw-alias-bg-layer-3:#fff; --dsw-alias-state-business-primary:#3262df; --dsw-alias-state-error-primary:#be2839; }
    * { box-sizing:border-box } body { margin:0;background:#f4f5f8;color:#25262b;font-family:"Segoe UI","Microsoft YaHei",sans-serif }
    main { max-width:1040px;margin:40px auto;display:grid;grid-template-columns:200px 1fr;min-height:85vh;background:white;border:1px solid #e2e4e9;border-radius:14px;overflow:clip }
    aside { padding:26px 18px;background:#f8f9fb;border-right:1px solid #e2e4e9;font-size:14px }
    aside b { display:block;margin-bottom:28px } aside span { display:block;padding:12px;border-radius:7px;background:#e8eefc;color:#2852b8 }
    article { padding:26px 32px;min-width:0 } h1 { font-size:20px;margin:0 0 16px }
    @media(max-width:650px) { main { margin:0;display:block;border:0;border-radius:0 } aside { display:none } article { padding:20px } }
  </style>
  <script defer src="/preview-react.js"></script>
  <script defer src="/preview-loader.js"></script>
  <script defer src="/lib/client.js"></script>
</head>
<body>
  <main><aside><b>DeepSeek Harness</b><span>启动动画</span></aside><article><h1>启动动画</h1><div id="panel"></div></article></main>
</body>
</html>
